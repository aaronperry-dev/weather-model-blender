# PWPF-style snowfall blender configuration.
# Member groups follow the constituent list in WPC's "About PWPF Products" page, updated for the 2026-11-03
# retirement of NAM / NAM-nest / HiResW / HREF / SREF (NWS SCN 26-47, 26-48), whose CAM role is now played by
# RRFS (deterministic + 5-member ensemble, 3 km) and HRRR - the same members NCEP combines into REFS
# (current + 6 h-old cycle of RRFS det and ens, plus 2 HRRR).  WPC has not published its post-transition
# constituent list, so treat the CAM part as the best public analogue.
#   10 GEFS | 25 ECMWF ENS | 10 CMC GEPS (perturbations 1-10, via NOMADS NAEFS copy) | GFS | ECMWF HRES | GEFS mean | 2 HRRR | 2 RRFS det | 10 RRFS ens | (WPC forecast)
# Groups not yet implemented as loaders are listed under `not_implemented`.

grid:
  stride: 1                  # 1 = full 2.5 km NDFD grid, 2 = 5 km, 4 = 10 km (fast previews)

cycle_hours: [0, 12]         # nominal cycles; every period is measured from the cycle time
bin_hours: 6                 # QPF/SLR/ptype are evaluated in 6-h bins, then summed into the periods below
workers: 4                   # concurrent member loads/processing
# Missing data: a member that fails (or does not reach a lead time) is left out of just the periods it cannot
# fully cover; each period is blended from whoever delivered it, weights renormalised.
min_members: 4               # a period with fewer complete members than this is skipped (not an error)
warn_members: 8              # periods with fewer members are flagged "reduced ensemble" in the viewer
member_failure_limit: 2      # stop trying a member after this many consecutive failed bins

# PWPF periods (About PWPF Products): 24 h totals every 6 h out to 72 h, 48 h totals made of two adjacent
# 24 h periods, and one 72 h total.  Ids: s24_f030 = 24 h ending 30 h after the cycle.  24-h-multiples only.
windows:
  step_h: 6
  max_h: 72
  lengths_h: [24, 48, 72]

thresholds_in: [0.1, 1, 2, 4, 6, 8, 12, 18, 24, 36]
thresholds_ice_in: [0.01, 0.05, 0.1, 0.25, 0.5]
percentiles: [5, 10, 25, 50, 75, 90, 95]

# ---- science settings -------------------------------------------------------------------------
snow_level:
  wetbulb_c: 0.5             # PWPF: 0.5 degC wet-bulb surface

accumulation:                # NOT in WPC's published recipe: how much of the falling snow accumulates (see README "Accumulation")
  enabled: false             # off = closest to WPC's published method; the A/B run (--accumulation on) is verified against NOHRSC
  wb_full_c: -1.0            # ground wet-bulb at or below this: all snow accumulates
  wb_zero_c: 1.5             # ... at or above this: only min_eff of it does (linear in between)
  min_eff: 0.25
  wb_lapse_c_per_km: 6.0     # wet-bulb rise below the 0.5 C level
  ground_melt_in_per_c: 0.15 # warm ground melts the first (0.15 in x soil temperature in C) of snow of the run

ice:                         # freezing rain: simplified FRAM (Sanders & Barjenbruch 2016), precip-rate term only
  enabled: true
  report: flat               # flat (elevated horizontal ice) | radial (= 0.394 x flat)
  radial_factor: 0.394
  min_total_in: 0.005        # a period gets an ice layer only if some member reaches this much ice

ptype:
  snow_sfc_max_c: 1.5        # decision tree (non-NCEP models): assumed thresholds
  frz_aloft_c: 2.0
  # WPC downscales ptype from the snow level AND a downscaled 2 m temperature.  Here: a grid point only keeps its
  # model's snow call if the 2 m T, moved to the 2.5 km terrain with this lapse rate, is <= snow_t2m_max_c
  # (terrain above the 0.5 C wet-bulb level still counts as snow).  Thresholds are our assumptions.
  t2m_gate: true
  snow_t2m_max_c: 1.5
  t2m_lapse_c_per_km: 6.5

slr:
  method: blend              # blend | kuchera | fixed   (NBM SLR isn't reproducible from public weights)
  adjust: 1.0                # PWPF applies an unpublished adjustment factor; calibrate with `validate`
  min: 3
  max: 40
  fixed: 11

downscale:                   # PRISM-based QPF downscaling
  ratio_min: 0.25
  ratio_max: 4.0
  smooth_factor: 1.0

mode:                        # stand-in for the human-edited WWD forecast
  method: pmm                # pmm | mean | external
  pmm_weight: 0.25           # 1 = pure probability-matched mean, 0 = plain mean (tune with `validate`)
  min_snow_in: 0.01
  external: null             # path to a GRIB2/npz with deterministic 24-h snow (inches) if method=external

calibration:                 # end-of-run report in the log: Northeast box statistics per model group + NWS reference points
  enabled: true
  windows: [s72_f072, s24_f024, s24_f030, s24_f036]
  # box: {lat: [40, 47], lon: [-80, -67]}
  # points: [[name, lat, lon, nws_72h_in], ...]   (defaults: pwpf_blender/calibration.py REFERENCE_POINTS)

# NOHRSC verification + calibration (python -m pwpf_blender verify-archive; see README "Verification and calibration").  WPC calibrates
# the PWPF probabilities against the NOHRSC snowfall analysis; we archive each run's raw 24 h fields, score them once NOHRSC has
# published the analysis, and fit three scale factors (mode, lower spread, upper spread) from the pooled pairs.
verification:
  enabled: true
  obs_latency_h: 3           # wait this long after a period ends before asking NOHRSC for its analysis
  archive_days: 14           # raw forecast fields (and downloaded analyses) are kept this long
  pair_keep_days: 180        # forecast/observation samples used for the calibration fit
  pairs_per_window: 6000
  max_fetch_per_run: 40      # at most this many NOHRSC downloads per run (1 request/s, one connection)
  max_tries: 6               # give up on a period whose analysis never appears
  min_cases: 8               # independent cycles needed before a calibration fit may be used
  apply_calibration: false   # true = scale the products with the fit (only when it matches the current science settings)

static:
  terrain: static/terrain_2p5km.npy          # made by `prepare-static`
  prism:   static/prism_ppt_monthly_2p5km.npy

web:
  px_m: 3000                 # Web-Mercator pixel size of the data layers (m); bigger = smaller files
  bin_bits: 8                # precision of the .bin.gz planes: 8 (~2 %, ~1-3 MB per period) or 16 (~0.01 %, ~4x larger)
  terrain:                   # browser-side terrain adjustment (AWS Terrain Tiles); see README "Terrain adjustment"
    enabled: true
    precip_gradient_per_km: 0.20       # +20 %/km of elevation above the model terrain (our assumption, capped below)
    precip_factor_range: [0.75, 1.35]
    snow_level_width_m: 100            # rain/snow transition width around the 0.5 degC wet-bulb level
    max_phase_ratio: 3.0
    min_zoom: 5
    dem_max_zoom: 12
    hillshade: true

# ---- ensemble members -----------------------------------------------------------------------
# run_hours/age_h/lags_h choose the model initialisation for a cycle:  the newest run hour <= cycle - age_h (age_h 0:
# the newest run that started by the cycle), then optionally earlier time-lagged runs (cycle - age_h - lag).  Before a
# run is used, its last needed forecast hour must be published; if not the previous run is used instead (and the one
# before that), and the member table says so.  Cycle 'auto' = the newest 00/12Z cycle that has started.  max_fxx_h: beyond that lead time,
# bins fall back to the `fallback` group (like PWPF's "time-lagged GFS/GEFS for Days 1.5-3").
members:
  - {name: gefs,      loader: gefs,       count: 10, pool: 30, pick: random, run_hours: [0,6,12,18], age_h: 0,  max_fxx_h: 240, weight: 1}
  - {name: ifs_ens,   loader: ifs_ens,    count: 25, pool: 50, pick: random, run_hours: [0,12],      age_h: 0, max_fxx_h: 144, weight: 1}
  - {name: cmce,      loader: cmce,       count: 10, pool: 20, pick: first, run_hours: [0,12],      age_h: 0,  max_fxx_h: 192, weight: 1}
  - {name: rdps,      loader: rdps,       members: [null], lags_h: [0, 6],   run_hours: [0,6,12,18], age_h: 0,  max_fxx_h: 84,  fallback: gfs, weight: 1}
  - {name: gefs_mean, loader: gefs,       members: [avg],                    run_hours: [0,6,12,18], age_h: 0,  max_fxx_h: 240, weight: 1}
  - {name: gfs,       loader: gfs,        members: [null],                   run_hours: [0,6,12,18], age_h: 0,  max_fxx_h: 384, weight: 1}
  - {name: ifs_hres,  loader: ifs_hres,   members: [null],                   run_hours: [0,12],      age_h: 0, max_fxx_h: 144, weight: 1}
  - {name: hrrr,      loader: hrrr,       members: [null], lags_h: [0, 6],   run_hours: [0,6,12,18], age_h: 0,  max_fxx_h: 36,  fallback: gfs, weight: 1}
  - {name: rrfs,      loader: rrfs,       members: [null], lags_h: [0, 6],   run_hours: [0,6,12,18], age_h: 0,  max_fxx_h: 84,  fallback: gfs, weight: 1}
  - {name: rrfs_ens,  loader: rrfs_ens,   members: [1,2,3,4,5], lags_h: [0, 6], run_hours: [0,6,12,18], age_h: 0, max_fxx_h: 60,  fallback: gefs, weight: 1}

# Available but not in WPC's list, so off by default: add this line to `members` to include the 15 km Canadian global.
#   - {name: gdps, loader: gdps, members: [null], run_hours: [0,12], age_h: 0, max_fxx_h: 240, weight: 1}
# (HRDPS, the 2.5 km Canadian model on dd.weather.gc.ca/model_hrdps/continental, covers only southern Canada and the
#  northern US, so it cannot supply a CONUS-wide blend and has no loader.)
not_implemented: []          # members in WPC's list that have no loader here yet

profiles:
  lite:                      # quick, smaller run (good for free GitHub runners / testing)
    grid: {stride: 2}
    member_counts: {ifs_ens: 10}
    disable: [rrfs_ens]        # 10 extra 3 km members; enable on a bigger runner / with the `full` profile
  synthetic:                 # no network; exercises the whole pipeline
    grid: {stride: 4}
    members_replace:
      - {name: syn_global, loader: synthetic_global, count: 30, pool: 30, pick: first, run_hours: [0,12], age_h: 0, max_fxx_h: 240, weight: 1}
      - {name: syn_cam,    loader: synthetic_cam,    count: 4,  pool: 4,  pick: first, run_hours: [0,12], age_h: 0, max_fxx_h: 30,  fallback: syn_global, weight: 1}
