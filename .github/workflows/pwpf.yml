name: Build PWPF-style snowfall guidance

on:
  schedule:
    # ~3h50m after the 00Z / 12Z cycles, once HRRR/RRFS/GFS 00Z/12Z and ECMWF 00Z open data are out
    - cron: "50 3,15 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile: lite | full | synthetic (no-network demo). Empty = repo variable PWPF_PROFILE or lite"
        required: false
        default: ""
      cycle:
        description: "Cycle (ISO UTC, e.g. 2026-01-15T12) or 'auto'"
        required: false
        default: "auto"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # dispatch input > repo variable PWPF_PROFILE > 'lite'.  Use 'full' for the complete ~60-member run.
      PROFILE: ${{ inputs.profile || vars.PWPF_PROFILE || 'lite' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "$PROFILE" != "synthetic" ]; then pip install -r requirements-live.txt; fi

      - name: Unit tests
        run: pip install pytest && python -m pytest -q

      - name: Data feed diagnostics (AWS/NOMADS)
        if: env.PROFILE != 'synthetic'
        continue-on-error: true            # informational: prints which feeds answer and what fields they hold
        run: python -m pwpf_blender diagnose --download

      # terrain and PRISM are cached separately so that a failed PRISM download is retried on the next run
      # instead of being frozen into a terrain-only cache entry
      - name: Restore terrain
        id: static_terrain
        uses: actions/cache@v4
        with:
          path: static/terrain_2p5km.npy
          key: static-terrain-v1

      - name: Restore PRISM normals
        id: static_prism
        uses: actions/cache@v4
        with:
          path: static/prism_ppt_monthly_2p5km.npy
          key: static-prism-v2

      # raw PRISM downloads (and the download ledger) survive between runs, even failed ones, so a retry never
      # re-requests a file (PRISM refuses a repeat download inside 24 h and the files are ~56 MB each)
      - name: Restore raw PRISM downloads
        id: prism_raw
        if: env.PROFILE != 'synthetic'
        uses: actions/cache/restore@v4
        with:
          path: static/prism_raw
          key: prism-raw-v1-none
          restore-keys: prism-raw-v1-

      - name: Prepare static inputs
        id: prepare
        if: env.PROFILE != 'synthetic' && (steps.static_terrain.outputs.cache-hit != 'true' || steps.static_prism.outputs.cache-hit != 'true')
        run: python -m pwpf_blender prepare-static --out static

      - name: Save raw PRISM downloads
        if: always() && steps.prepare.outcome != 'skipped' && hashFiles('static/prism_raw/**') != ''
        uses: actions/cache/save@v4
        with:
          path: static/prism_raw
          key: prism-raw-v1-${{ github.run_id }}

      - name: Run pipeline
        run: |
          ARGS="--cycle ${{ inputs.cycle || 'auto' }} --out site/data --save-npz"
          if [ "$PROFILE" = "synthetic" ]; then ARGS="$ARGS --synthetic"
          elif [ "$PROFILE" != "full" ]; then ARGS="$ARGS --profile $PROFILE"; fi
          python -m pwpf_blender run $ARGS

      - name: Assemble site
        run: cp web/* site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/upload-artifact@v4
        with:
          name: fields-npz
          path: site/fields_*.npz
          if-no-files-found: ignore
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
