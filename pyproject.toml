[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pwpf-blender"
version = "0.1.0"
description = "Unofficial open re-implementation of WPC's PWPF 2.5 km probabilistic snowfall guidance"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pillow>=10", "pyyaml>=6"]

[project.optional-dependencies]
live = ["xarray", "pandas", "cfgrib", "eccodes", "herbie-data", "ecmwf-opendata", "requests"]
dev = ["pytest"]

[tool.setuptools]
packages = ["pwpf_blender", "pwpf_blender.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
